semantics:
  callback_order: snapshot at S BEFORE callback whose clamped receive R>=S; no timestamp shifting
  clock_domains: receive and exchange separately ordered; E<=R or E<=S is not assumed
  closure: next distinct observed exchange-time callback at its receive availability; final open cluster right-censored
  admission: both legal bid and ask change same sign; zero positive reported prints in entire CLOSED formation exchange cluster (including after quote) AND since
    prior valid book; both initial queues positive
  ownership: exact shared touch-pair visit; any pair departure ends unfinished credits; returns do not restore them
  completion: confidence1 exact-bid SELL and exact-ask BUY in distinct later closed exchange clusters
  completed_retention: completed historical testing fact until next completion, hard source-epoch censor or day change; ordinary unknown/mixed prints and book-freshness
    gaps clear current visit credit, never erase a completed fact
  freshness: 5s independent within-axis inference/bounding-book guards for CURRENT credit; stale received-book view is NaN without TTL erasure; valid fresh view can
    reexpose completed landmark
  quantity: int32 source quantities; int64 bounded exact cumulative work; no epsilon; frozen queue references
  positive_invalid_or_ambiguous_trade: blocks formation and current visit attribution across its whole closed group; preserves completed historical landmark; conservative
    raw proxy even if native filter would drop invalid-price print
  nonpositive_trade: native TwseFilter suppresses callback; cannot close observed cluster or poison a zero-print interval
  missing: missing fixed cell/required symbol metadata is skipped and reported without replacement; per-cell gates apply to present cells, >=1 observed and global5each
    direction/20contrast unchanged; changed present artifact rejects integrity
  hard_epoch_censor: TRIAL/AUCTION/SUSPEND, hard invalidbook, exchange regression, cumulative quantity overflow, day change clear current credit and completed landmark
fields:
  visit_phase: warmup/inactive/provisional/bid_tested/ask_tested/bilateral/untestable/censored/stale; current received pair guards closed visit view; untestable preserves
    historical fact, censored breaks source epoch
  completed_mark_direction: direction only; last completed quote-led mark +/-1
  accepted_anchor_offset_5ticks: direction/magnitude context; exact full-ladder current mid minus completed mid divided by5000milliticks
  bilateral_test_strength: magnitude of testing evidence, not future movement claim; min(EB/(QB+EB),EA/(QA+EA)) frozen at first completion
  completed_receive_age_300s: historical information age divided by300s; not a TTL or feature window
evidence_limits:
- proxy support is label-free and not native FE parity
- later actual native receive-prefix and four-cell parity required before predictive FE comparison
- no model/labels/horizon metrics or universe selection in this study
- V3 scientific sources, FE judge and native producer remain unchanged
- same completed landmark repeated across origins is counted only once for recent support
- source support failure rejects this recipe without new dates, symbols, thresholds, sampling or retention expansion
