# Pure signal validation (trading-unaware): does the native feature engine predict
# mid-price moves of >= threshold_ticks over each horizon? No costs, eligibility,
# policy or execution. Run: python3.13 -m astra.signal <command> --profile signal.yaml
name: astra-signal
# Frozen hypothesis research uses the same signal CLI and this profile entry.
# Its explicit 2026-only roles, native labels, CatBoost budget and acceptance
# rules are owned by the referenced versioned contract, not legacy fit flags.
# python3.13 -m astra.signal representation --profile signal.yaml --stage run
representation_research:
  profile: ../information_state_20260930/profile.yaml
paths:
  coco_binary: ../../../build/Release/src/app/coco
  market_data: /mnt/data0/marketdata/tse/kgi/stock
  futures_data: /mnt/data0/marketdata/taifex/kgi/futures
  contracts: /mnt/data0/contract/tse/stock
  futures_contracts: /mnt/data0/contract/taifex/futures
  calendar: /mnt/data0/info/tw_trading_calendar.yaml
  daily_stats_script: /mnt/data0/scripts/build_daily_md_stats.py
  stats_start: '20251101'
  work: ../../runs/signal
universe:
  # Frozen from the screen below (pre-development days only); never replaced.
  symbols: ['4989', '8150', '2486', '1802', '8039', '2344', '2375', '2481', '8210', '2337', '6770', '6706', '6209', '1303', '8112',
            '2360', '5469', '6139', '8271', '2404', '6669', '2485', '6531', '3661', '1504', '6890', '1301', '3653', '6515', '2345']
  screen:
    window: ['20251114', '20251211']
    reference_info: /mnt/data0/info/tse/stock/twt84u  # previous close for the >= min_price prefilter only
    min_price: 10
    horizon_seconds: 300
    min_days: 18
    min_turnover: 5.0e8   # TWD, median per day
    max_spread_ticks: 2.0
    min_rate: 0.02        # share of 1 s origins with |mid move| >= threshold at the horizon
    top: 30
dates:
  first: '20250602'
  last: '20260924'
  reference_symbol: '2330'
  sealed_days: 30        # final evaluation only
  dev_days: 150
  train_days: 100
  purge_days: 1
  early_stopping_days: 10
session:
  start: '091000'
  until: '130000'
  interval: 10s
target:
  kind: mid_ticks
  horizons: [60, 120, 180, 300]
  threshold_ticks: 5
features:
  base: pool
  sets:
    # Every compiled native template, plus labels; defines the rows of each role.
    pool: {pool: true, labels: true}
    # Cross-sectional return context: every universe symbol as a peer, TXF near month as reference.
    cross:
      fallback: cross_noref
      modules:
        - type: CrossReturnContext
          id: 0
          peers: true
          references: [TXF@1]
          spec: {TargetSymbol: '{Target}', ReferenceSymbol: TXF@1, Windows: [10s, 30s, 60s, 120s, 300s, 600s, 1200s], StatusFilter: '!SUSPEND'}
          exports: ['target_return_z*', 'peer_return_z*', 'peer_return_bps*', 'peer_breadth*', 'residual_return_z*', 'reference_return_z*', 'reference_gap_z*',
                    target_sigma_bps, peer_sigma_ratio, peer_coverage]
    # Days without TXF data: the same context without the reference.
    cross_noref:
      modules:
        - type: CrossReturnContext
          id: 0
          peers: true
          spec: {TargetSymbol: '{Target}', ReferenceSymbol: '', Windows: [10s, 30s, 60s, 120s, 300s, 600s, 1200s], StatusFilter: '!SUSPEND'}
          exports: ['target_return_z*', 'peer_return_z*', 'peer_return_bps*', 'peer_breadth*', 'residual_return_z*', 'reference_return_z*', 'reference_gap_z*',
                    target_sigma_bps, peer_sigma_ratio, peer_coverage]
model:
  task_type: GPU
  iterations: 2000
  learning_rate: 0.08
  depth: 8
  l2_leaf_reg: 10.0
  border_count: 128
  od_wait: 100
  seed: 17
  head: multiclass  # multiclass | hybrid (magnitude x calibrated regression direction)
evaluation:
  bootstrap: 200
