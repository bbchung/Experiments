followup:
  negative_result: Retain A and record Q failure/inconclusiveness. If Q improves ranking but native net remains poor, diagnose target/cost/execution bottlenecks;
    do not promote the selector.
  only_if_all_required_conditions_hold:
    attribution: Before selector promotion, separately test removal of IC gates with redundancy retained and removal of redundancy with IC retained; preregister these
      follow-ups before execution.
    confirmation_seeds:
    - 37
    - 2027
    design: Repeat both arms on all three unchanged folds; no HPO, threshold search, interval movement or selective seed reporting.
  promotion: Requires reproducible economics, seed/fold support, acceptable concentration, successful native/semantic parity and documented attribution. This is validation
    evidence, not final OOS.
hypothesis: Univariate IC support/floors and approximate redundancy can discard conditionally useful native information; quality-only selection improves fixed-policy
  native net economics across chronological origins.
hypothesis_id: Q1-quality-only-selection
primary_comparison:
  concentration:
    Q_max_day_positive_profit_share: 0.3
    Q_max_symbol_positive_profit_share: 0.6
    rule: A result dependent on a single lucky symbol/day is not promoted; show leave-largest-day and leave-largest-symbol effects and each fold.
  measure: Paired daily native net PnL Q minus A pooled across the three forward windows
  not_automatic_promotion: true
  required_followup_conditions:
    Q_minimum_round_trips_each_fold: 20
    Q_minimum_round_trips_total: 100
    Q_pooled_net_pnl_under_1_2_fee_stress_strictly_positive: true
    minimum_improved_folds: 2
    pooled_net_pnl_delta_strictly_positive: true
schema_version: 1
status: preregistered_not_started
staged_execution_addendum_20260926:
  registered_before: Control model/forward outcomes and either corrected A/Q fit; baseline_universe is still running.
  rationale: Existing long-history negative stock economics make all six fits low-value unless the first pair survives cost-aware triage.
  first: Inspect already-generated control opportunity, tail, fee, fill and rejection diagnostics. No midpoint endpoint statistic is treated as an execution upper
    bound.
  pilot: Run corrected F1 A and Q with seed1729 on identical immutable material and original planned dates. This is exploratory research validation.
  continue_F2_F3_only_if:
  - F1 Q native total net PnL is positive.
  - F1 Q minus A native total net PnL is positive.
  - F1 Q has at least20 completed native round trips.
  on_futility: Retain both arms and all outcomes; stop this Q1 family without promotion. A predictive gain below the cost hurdle redirects research to information/target/venue/execution;
    it does not establish that quality-only selection is universally inferior.
  on_continuation: Preserve F1 in the pooled result; run both remaining frozen folds. Every original three-fold economic, coverage, stability and confirmation requirement
    remains necessary.
  universe_interpretation: June30 universe is fixed before all forward folds. Earlier fitting, early stopping and calibration are retrospectively conditioned on pre-forward
    eligibility/liquidity/volatility; no April-May historical deployability or survivorship-free historical-universe claim.
material_identity_clarification_20260926:
  registered_before: Either corrected A or Q fit; original control completed and corrected-source tests passed.
  completed_control: runs/e2e-20260926/control-replay-v2
  control_compatibility: Original engine and recipe with the two recorded historical-replay and metadata-ineligible omission exceptions; all16 omissions independently
    verified as completed native runs with zero events/origins.
  reason: Runtime request lineage hashes the full profile, including the selector override, so role artifact wrappers must differ even when their immutable native
    material is identical. Wrapper identity is not a data-population comparison.
  required_equality: Same ordered universe, role dates, eligibility/omissions, target, sampler, native feature columns/order and semantic manifests, native material
    day identities, underlying content-addressed partition providers, Parquet content and sample keys/labels/features. Compare before interpreting paired outcomes.
  allowed_difference: Outer lineage wrappers caused by the selector profile and its derived requests; retain both complete provenance chains.
  failure_rule: Any unexplained native material/population difference invalidates the paired comparison. Repair correctness and repeat both affected arms; do not
    interpret the difference as a selector effect.
  unchanged: All hypotheses, model and policy settings, resource fallback, planned boundaries, staged futility criteria and promotion requirements remain frozen.
