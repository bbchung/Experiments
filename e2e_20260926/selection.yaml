arms:
  A:
    kernel_overrides: {}
    minimum_abs_ic: 0.03
    minimum_abs_magnitude_ic: 0.05
    redundancy_threshold: 0.85
    selection: Unchanged PMQ plus canonical representation normalization
  Q:
    approximate_redundancy: false
    canonical_representation_normalization: true
    ignored_predictive_checks:
    - ic_support
    - ic_floor
    kernel_overrides:
      pmq_selection: quality_only_selection
    maximum_special_fraction: 0.15
    minimum_coverage: 0.75
    minimum_daily_coverage: 0.5
    minimum_days: 9
    minimum_panel_rows: 20
    minimum_rows: 200
    retained_checks:
    - native_alpha_factor
    - nonconstant
    - special_value_fraction
    - value_support
    - availability
    - daily_availability
    - no_exact_label_copy
    selection: Reuse the exact complete train-only PMQ statistics and provenance; no additional raw data or labels.
artifacts_to_retain:
- Frozen source/binary/environment and this design hash.
- Initial universe and per-fold planned/observed dates, omissions, daily eligibility and exposure lineage.
- A/Q selection artifacts, identical material identities, full PMQ statistics and canonical representation evidence.
- All fitted model.cbm/model-info.yaml artifacts, calibration thresholds, Python/native parity and forward predictions.
- Native orders, daily/stock PnL, fees, round-trip attribution, stress calculations and paired summary, including all failed arms.
calendar:
  path: /mnt/data0/info/tw_trading_calendar.yaml
  sha256: 8b1b6c57bbc79137516aca57a61ede352523e41ba800010bb6b6b011f2bdcf78
controls:
  costs:
    commission_each_side: 0.0004275
    fund_sell_tax: 0.001
    kind: rates
    stock_sell_tax: 0.0015
    stress_evaluation: Gross native PnL minus 1.2 times actual native charged fees/taxes on the same realized fills; not a change to execution assumptions.
    stress_multiplier: 1.2
  execution: Native CBPredictor -> Fuxi -> SimExchange; same semantic/native parity gate, shared credit10m, max1lot/symbol, md/request/response latency33/2/1ms.
  feature_population: Same native numeric AlphaFactor columns and abstraction scope in both arms; retain existing canonical_features producer-identity normalization.
    No categorical additions.
  initial_control: runs/e2e-20260926/control-replay
  initial_control_revision: e6c9bb296
  material: Identical immutable train/tune/forward artifacts, native features, labels, all sample keys and row populations within each pair. Rebuild material under
    the frozen corrected engine; do not train on old lost-origin exports.
  model:
    depth: 6
    early_stopping_rounds: 60
    family: CatBoostRegressor
    hpo: false
    iterations: 600
    l2_leaf_reg: 5.0
    learning_rate: 0.05
    loss: RMSE
    nan_mode: Max
    recency_half_life_days: 40.0
    seed: 1729
    weighting: balanced
  policy: Same fixed q95 rule; each model calibrates its numeric buy/sell thresholds on its own predictions over the same preceding calibration dates. TTL60s, no
    stop/takeprofit, order minimum age100ms, exit improve tick0.
  profile: baseline.yaml
  resource_fallback: No feature-count cap or sample truncation. If the complete Q pool cannot fit on GPU, record failure and prerecord a common CPU rerun for both
    arms with otherwise identical settings.
  rows: Retain all native scoring origins, including unresolved labels. Finite-label masks apply only to supervised fitting and outcome summaries; report unresolved
    coverage separately.
  sampling: book_flip price_flip, zero minimum interval; 091000-130000
  target: native 60-second mid_return_ticks, gross; OriginMidPrice is cost accounting metadata and is excluded from model inputs
  universe: Freeze initial control selected symbols for all folds; retain same causal daily eligibility panel within every pair.
date_rules:
- F1 development roles exactly match the original84-day control; its unused final slot is compressed to one explicit unused placeholder for this historical validation
  design.
- Wholly missing market dates are omitted in place for both arms; preserve every planned boundary and record omissions. No symbol/date exclusions based on outcomes.
- All forward observations are before20260828; final-slot placeholders are not declared pristine holdouts.
- Folds have distinct forward days; overlapping earlier training/calibration is intentional chronological refitting.
diagnostics:
- Per-fold/daily/symbol net and gross PnL, actual fees, round trips, exposure, drawdown, fill and rejection attribution, shared credit constraints.
- Prediction ranking/tails, calibration thresholds, triggered coverage, matured/unresolved outcomes and selected feature families; proxies never authorize promotion.
- Paired3-day-block uncertainty intervals; retain all fold/arm/seed outcomes, including failures, inconclusive results and negative economics.
- Actual RAM/GPU peak, fit/replay time and feature counts; efficiency is secondary to native economics.
evidence_role: iterative_research_validation_not_final_oos
execution_prerequisites:
- Complete incumbent control reproduction and record its immutable artifacts.
- Root freezes corrected C++/Python source, binary, dependency environment and this design before either arm runs.
- Both arms use corrected DatasetWriter schema v2 with all captured origins preserved.
- Validate actual row counts and full-feature host/GPU memory requirements; run arms sequentially.
