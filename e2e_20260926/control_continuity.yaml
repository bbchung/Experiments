  semantics: Preserve the complete original role lists and corrected A eligibility. The unused final slot is exposed history and is never evaluated as final OOS. Missing observations are not replaced.
execution:
  workflow: Ordinary canonical baseline graph; no selector, cache, learning or policy adapter.
  store: AstraResearch/runs/.cache/dataset
  engine_workers: 16
  epoch_hours: 24
  task_timeout_seconds: 1800
  operational_limit: One fixed graph within the original 24-hour epoch budget. Budget exhaustion is incomplete measurement, not scientific failure and not authority for an unbounded restart.
  universe_cost: Retained all-missing request shape is 602 native metric batches over 43 days and36777 stock-day metrics; actual cache hits and invocations must be reported. This is not a measured runtime forecast.
  prefix_boundary: Use the existing cancellation/checkpoint interface to stop after universe and eligibility panel and before feature bootstrap or dataset generation.
  prefix_acceptance: Original automatic prefilter, metric source/population scope, missingness, predicates, ranks and exact ordered roster must agree; corrected A role lists and eligibility panel must agree. Preserve actual old and new producer identities. Source or semantic drift stops before the one fit.
  continuation: Root records a passing source-bound prefix verification and a concrete invocation freeze before resuming the same graph. No automatic pinning, replacement population, changed date or favorable fallback.
evaluation:
  completion: Account for every original planned/observed date, source and eligible partition; new model/native parity must pass; original fixed policy must finish with valid native orders, positions and cash accounting.
  report: Preserve full per-day gross, fees, net, trips, flatness, support and missingness; compare with A descriptively over the same full panel, retaining changed trees/features/thresholds as downstream consequences.
  failure: Diagnose technical/source/prefix/parity/accounting failure without a scientific verdict or parameter rescue.
  weak_or_negative: Current-control measurement closes; no automatic new feature, model, seed, threshold, policy or universe experiment follows.
  apparent_improvement: Attempt to explain it through population, numerical, selection, calibration and execution differences. Any further validation needs a separate predeclared question; these repeatedly exposed days cannot establish OOS performance or workflow superiority.
  family_boundaries: Q1, W4, W5, population-role triage, TXF and other closed studies remain closed. The prepared old-model v3 replay is not an additional prerequisite.
