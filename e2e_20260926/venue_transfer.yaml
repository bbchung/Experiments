selection_contract:
  - Thresholds are stored prior-month early-stopping q95 values; no refit or recalibration.
  - Each arm and side is spaced independently by 1800 seconds before endpoint/label/quote checks.
  - Original and late-session selected intents are retained; predeclared late intents are outside the economic support denominator.
  - All mapped in-session intents remain in the support denominator including absent files, invalid paths and stale quotes.
  - Stock-stop invalid labels stay unresolved; fixed-horizon diagnostics do not require a finite stock label.
  - Native timestamp joins accept only unique native origins at the selected time; selected duplicate timestamps remain explicitly unresolved without outcome-based disambiguation, and unselected duplicate timestamps do not invalidate other intents.
  - Quotes match in original receive order; all earlier same-timestamp records retain source order; no ExchangeTime resort.
  - Delayed quote queries use records strictly before arrival, matching native timer-before-publication ordering; exact-arrival tie counts are reported.
  - Invalid books and noncontinuous trade messages invalidate held state; observations never bridge these gaps.
  - Quote-age cutoff is a fixed measurement policy, not an exchange execution or liquidity guarantee.
  - Both independently spaced sides are reported separately and jointly; their aggregate is not an executable portfolio.
  - Both primary arms and both endpoint sensitivities are reported; sensitivity winners cannot rescue a failed primary arm.
limitations:
  - Existing scores have incomplete model/source lineage; freezing their bytes does not reproduce their trainer.
  - Legacy score origins were drawn from old DatasetWriter label outputs, which could omit unresolved EOF origins; impact inside this early entry cutoff is unknown. Support refers to extant historic scores, not the complete causal captured population.
  - Historical calibration filters finite labels; this describes the original cohort rather than direct forward-month leakage.
  - Price and market prototype inputs used finite origin quotes from one-flip label outputs; if their historical producer invalidated origin quotes on future invalidation, price-path population can inherit future-validity selection. Incomplete lineage leaves this unresolved; positive evidence requires raw/native reconstruction before adoption.
  - Historical contracts have exact-name mappings but lack complete adjusted deliverable terms; ordinary alphabetic roots assume nominal 2000 shares.
  - Excluded small, nonalphabetic adjusted, ambiguous, non-common-stock and non-exact mapped products cannot be silently replaced.
  - Existing CSV vintages omit some empty-book/status observations corrected by later parser work.
  - Quote markouts omit actual queue, fills, depth exhaustion, request/response timing and capital constraints.
  - Reported markout means are conditional on observed endpoints; unknown returns are never imputed as zero and even a small unresolved tail can dominate a small observed edge.
  - Three months of already exposed research data cannot establish stable final OOS profitability.
