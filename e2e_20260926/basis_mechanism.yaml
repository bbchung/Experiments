schema_version: 1
study: native-stock-ssf-basis-20260926
status: root_review_approved_pending_implementation_freeze
evidence_role: research_validation_native_features_and_quote_markouts_not_native_execution_or_final_oos
native_engine:
  binary: ../build/end_to_end_research_20260926/coco-correctness-v2
  binary_sha256: ee3c83f023b124852469715e93ecf2b1d06d215b4cd5758e1d7a31194b240fc5
  base_revision: e6c9bb296aa16aac8499e4d37b27ea7a84ef761b
  source_manifest: ../build/end_to_end_research_20260926/correctness-v2-source.json
  source_patch: ../build/end_to_end_research_20260926/correctness-v2-source.patch
  source_patch_sha256: 4e949c0e9803e87f5d3fb2ffea3ba52393bd6262947811fbec6d9aa4d476e1be
scope:
  primary_pair: {product: CDF, stock: '2330', shares_per_contract: 2000}
  fixed_comparators:
    - {product: DHF, stock: '2317', shares_per_contract: 2000}
    - {product: DVF, stock: '2454', shares_per_contract: 2000}
  rationale: Existing structural panel identified CDF's finer tick versus stock; DHF/DVF are fixed comparison pairs, not alternative winners if CDF fails.
  distinction_from_H1: New native short-horizon pair information; no existing stock scores, venue substitution, long-horizon stock stops, model fit or HPO.
  relationship_to_audit: Narrow test of H2 relative-price information and an H7-inspired same-pair clock-coverage diagnostic; not a replication of H2 micro-price or H7 TXF shocks.
hypotheses:
  current_relative_level: A June-centered stock-minus-SSF log basis identifies subsequent executable SSF adjustment beyond same-event nondirectional and constant-direction controls.
  historical_representation: The native 60-second past valid-dwell deviation adds value beyond the June-centered current basis on identical opportunity origins.
  sampler_coverage: Some fresh pair deviations arise after reference changes while the SSF price-flip gate remains silent; this justifies clock research only if the quote effect survives costs and delay.
  delay_confound: An effect that disappears at 250ms execution delay is too timing-sensitive for advancement here; receive-order results cannot establish exchange-time economic leadership.
dates:
  calendar: /mnt/data0/info/tw_trading_calendar.yaml
  calendar_sha256: 8b1b6c57bbc79137516aca57a61ede352523e41ba800010bb6b6b011f2bdcf78
  planned_rule: Every calendar trading day from 20260601 through 20260826, excluding only the calendar's prelisted unscheduled_closures; freeze exact list before export.
  expected_planned_days: 61
  expected_month_counts: {'202606': 21, '202607': 22, '202608': 18}
  discovery: ['20260601', '20260630']
  validation: ['20260701', '20260826']
  protected_from: '20260828'
  omissions: Preserve every missing date/pair and its reason in the planned panel. Do not replace dates, select another delivery, drop a bad symbol or exclude a limit regime based on outcomes.
  prior_exposure: June/August structural inspections used no future returns; these months remain research validation, never pristine final OOS.
prerequisites:
  - Root reviews this complete protocol before any native market replay or future-return read for this study.
  - Freeze corrected-v2 binary including origin preservation, ReturnLabel reset handling and existing CrossMarketBasis fixes; record binary/source/environment/protocol hashes.
  - Use a new study output directory; never append a retry to prior native output files.
  - Record development exposure for TWSE and all three TAIFEX products before market export or quote-outcome access.
  - Freeze per-day metadata relationships, native resolved monthly contracts, source precedence, hashes, full planned dates and missing partitions.
  - Verify native stock_future ladder and 2000-share point value with MarketInfoWriter; no fixed-tick futures profile substitution.
mapping:
  contract_root: /mnt/data0/contract
  permitted_relationships: [underlying_symbol, legacy_name_exact]
  delivery: Native TaifexSymbolResolve rank1 with the trading calendar, frozen as an explicit dated monthly contract before market replay.
  metadata_limit: June-August files use legacy exact-name evidence; do not claim authoritative exchange underlying IDs or adjusted-contract economics.
  stock_root: /mnt/data0/marketdata/tse/kgi/stock
  future_root: /mnt/data0/marketdata/taifex/kgi/futures
  missing_source: Preserve unresolved; do not substitute a next-month future or another feed after seeing outcomes.
  recording_choice: CSV.zst only for both native features/labels and economic quotes. Each native job receives a private input root containing symlinks only to the exact hashed CSV files; bin.zst and other feeds are unavailable there. This controlled study input choice does not promote a canonical recording format.
native_export:
  config_template: basis_native.example.yaml
  one_replay_per_pair_day: true
  target: Explicit dated SSF contract
  reference: Underlying stock
  basis_sign: 10000 * (log(stock_mid) - log(SSF_mid)); positive predicts SSF up, negative predicts SSF down.
  baseline_window: 60s
  maximum_leg_receive_age: 3s
  features:
    - basis_bps
    - basis_deviation_bps
    - target_age_s
    - reference_age_s
    - target_latency_s
    - reference_latency_s
    - reference_spread_bps
    - basis_history_fraction
  primary_clock: Fixed native 250ms grid from 09:10:00 through 13:00:00, anchored to the trading date.
  diagnostic_clock_traces: Native target and reference price_flip, zero minimum interval, keys only, same window and unchanged feeds.
  metadata: Native target/reference mids and target bid/ask ticks; accounting/context only, never extra candidate signals.
  label_roles: Native SSF mid-return bps at 1/5/30s are gross endpoint diagnostics; executed quote markouts are distinct economic outcomes.
  label_implementation: Corrected ForwardReturnRateLabeler, latest source state at/before deadline, including all equal-time source updates. A finite reseed before the deadline restores an endpoint after an earlier invalid episode. A strictly later source update/invalidation must prove deadline coverage; no arbitrary age cutoff applies to a held native endpoint. Periodic-origin source values use strict-prior receive events because the timer fires before a same-time quote.
  row_contract: Preserve every captured origin and signed/sentinel feature value; sample_summary v2 sampled==emitted and pending==0. Never select origins using matured labels.
  identity_checks:
    - Exact keys, schema, feature semantics and source/config/binary identities; repeated pilot export must reproduce keys and feature/label bits, including NaNs and infinities.
    - Every grid SampleBookTime is at/before SampleTime. All quote decisions use receive order; tied raw timestamps retain native ordering and sequence.
    - Three view definitions below are column views of the same export, not separate FE runs or feed contexts.
    - Verify origin-aligned native returns against an independent CurrentBook source-state reconstruction on the pilot, including one-sided/stale-held/invalid/reseed cases and rollover metadata. Use inclusive latest source<=deadline with later-source coverage. Native endpoint semantics deliberately differ from strict-before economic quote joins, economic3s freshness and any-invalid-path censoring; legitimate differences are reported rather than called parity failures.
staging:
  plumbing_pilot: All three fixed pairs on 20260603; inspect schema, origin coverage, feature formulas and sentinel/label semantics only before selecting the remaining export jobs.
  pilot_decision: Technical contract pass permits the already-frozen full panel. Technical failure blocks and requires a recorded correctness amendment; no pilot PnL gate or favorable date substitution.
  full_export: All remaining planned June/July/August26 pair-days. Eight candidate columns, small metadata/labels and key-only flip traces; no broad FE panel.
  resource_budget: About 10.1 million planned grid rows before omissions across 183 pair-days; run at most two pair-days concurrently, reuse each export across all views and horizons.
calibration:
  interpretation: June feature-only calibration is performed; this is not a learner fit or HPO.
  eligibility: Use all grid origins with finite raw basis and finite deviation and both legs fresh under the native contract. Keep rejected/warmup/unavailable origins in coverage reports.
  raw_center: One per-pair median of native basis_bps over eligible June grid origins, using no return/quote-outcome values.
  raw_score: basis_bps minus that frozen June median.
  deviation_score: Native basis_deviation_bps without additional centering or scaling.
  tail_cutoffs: One per-pair empirical 0.90 quantile of absolute raw_score and one of absolute deviation_score, over the same eligible June population; quantile method linear.
  trade_rule: Active when abs(score)>=its frozen cutoff and abs(score)>0; sign(score) determines side. Retain threshold ties and report their coverage; no target-specific threshold tuning.
  no_july_august_refit: No recentering, threshold refresh, parameter selection, side inversion or window adjustment after June.
views:
  C: Context-only matched controls on exactly the same event/quote population; always long, always short and deterministic expected 50/50 side payoff. No fitted context-direction predictor.
  R: June-centered current native basis with its frozen June absolute-tail cutoff.
  D: Native 60-second valid-dwell deviation with its frozen June absolute-tail cutoff.
  common_event_schedule: Form R-or-D active union from contemporaneous features, then greedily retain the earliest origin at least 5 seconds after the previous retained origin within each day/pair, before reading outcomes.
  inactive_arm: Zero position and zero PnL at a retained union origin where that arm is inactive; report own-active and common-union denominators separately.
  information_metrics: Raw native basis and native deviation per-day/per-pair Spearman IC versus 5s native SSF return, with 1/30s diagnostic IC; do not pool raw levels across pairs/days into one misleading IC.
  representation_comparison: D minus R paired daily cash PnL and equal-day mean net bps on the common union; report every pair/month and selected coverage. A basis win alone is not a history benefit.
  context_strata:
    reference_receive_age_ms: [0, 50, 250, 3000]
    native_history_fraction: [0, 0.5, 1]
    target_spread_native_ticks: ['<=1', '>1']
    time_blocks: ['09:10:00-10:30:00', '10:30:00-13:00:00']
    report: Signed effects and R-D differences within predeclared cells, counts and sparse/empty cells retained. Additional delay-skew quantiles are descriptive, not a stratum search.
  context_limit: Same-origin controls hold observed context fixed, but do not establish conditional incremental information beyond every existing feature or a trained context model.
quote_economics:
  primary_horizon_us: 5000000
  diagnostic_horizons_us: [1000000, 30000000]
  primary_execution_delay_us: 50000
  delay_sensitivity_us: 250000
  entry: Last received target quote strictly before SampleTime+execution_delay, never the first quote after the requested execution time.
  exit: Last received target quote strictly before entry_requested_time+horizon; horizon is measured from delayed entry, not from the original grid time.
  execution: One SSF contract, buy at entry ask and sell at exit bid for long; sell at entry bid and buy at exit ask for short. Quote opportunity diagnostic, not assumed native fills.
  freshness: Both endpoint quotes at most 3s old, continuous, finite positive bid<ask and positive touch quantities. A later invalid quote breaks prior validity; do not search backwards around invalid states.
  capacity: Both bid and ask must show >=1 contract at each endpoint, for identical feasible long/short controls. Never apply a favorable-side-only capacity filter.
  path_episode: An observed halt/auction/invalid target episode inside an endpoint interval is unresolved for this conservative markout, even if the later endpoint is valid again.
  fees:
    commission_each_side_twd: 50.0
    tax_each_side_rate: 0.00002
    round_trip_formula: 100 TWD + 2000*(entry_price+exit_price)*0.00002
    stress: Same quotes/intents and gross PnL minus 1.2 times charged reference fees; no cost or fill assumption changes.
  bps_denominator: 2000 times target midpoint at delayed entry, common to both direction controls.
  unknown: Keep every scheduled/active intent and exact unresolved reason. Unknown outcomes are neither zero returns nor non-trades. Separate feature availability, entry feasibility and future endpoint availability.
  whole_day_unknown: A missing export or market recording is an unknown pair-day, never a zero-trade day. Retain the planned panel and omission reason; exclude unknown days from numeric policy series and report their planned-day coverage impact explicitly.
  paired_latency_population: Report each delay on its own fixed-intent population and the intersection with known feasible 5s quotes at both delays; retention uses only the intersection. The 30s outcome never gates 5s evaluation.
  source_order: Parse raw streams in received order without exchange-time resort. Same-timestamp entry/exit queries use strict-before receipt. Preserve sequence tie records and native invalid/regression evidence.
sampler_diagnostic:
  population: Every eligible fixed-grid origin and every native reference-price-flip origin; never condition event inclusion on future target moves.
  measures:
    - Fraction of contemporaneous eligible R/D-tail grid opportunities more than 1s after the latest target price flip, with the reference having changed since that flip.
    - Time from each reference flip to the next target flip, preserving right-censored no-followup episodes and reporting invalid paths separately.
    - At grid opportunities in these quiet-target intervals, compare fixed 5s quote economics to ordinary target-active intervals under the same frozen rules.
  interpretation: Clock-coverage evidence may motivate a later native reference-driven sampler experiment; it does not itself change the canonical sampler or implement signal/execution clock separation.
inference_and_gates:
  primary_family: CDF only, two prespecified economic views R and D. Neither DHF/DVF nor diagnostic horizons may rescue a CDF failure.
  primary_metric: Equal-day mean active-intent net bps, with monthly native-contract cash sums and the common-union zero-inactive comparison also required and retained.
  uncertainty: Paired circular 3-trading-day block bootstrap within July/August, 4000 draws, seed1729; one-sided 97.5% lower bound per R/D view for a two-view 5% family. Keep zero-trade days and all fixed pairs; a day with no active intent contributes zero to the daily policy-payoff series, while unresolved active outcomes are never assigned zero.
  support_required:
    primary_active_known_events_each_validation_month: 100
    primary_known_fraction_of_active_intents_each_validation_month: 0.95
    primary_validation_months_with_observed_pair_days: 2
    primary_observed_complete_pair_days_fraction_each_validation_month: 0.90
    reference_context_strata: Report all; no outcome-dependent removal of adverse or sparse cells.
  advance_a_prespecified_CDF_view_only_if_all:
    - Positive mean net bps and positive total cash quote PnL separately in July and August26 at 50ms.
    - Strictly positive pooled equal-day mean net bps at 1.2 fee stress and positive family-adjusted lower bound on ordinary net bps.
    - Positive directional excess over the same-event expected 50/50 control in each validation month, and positive pooled excess over the better constant-direction control on the same active events.
    - On common-known 50/250ms events, 250ms net bps remains positive and directional gross excess over 50/50 retains at least one third of the 50ms excess.
    - Removing the single best validation day leaves positive net cash PnL; no one day contributes over 30% of total positive-day PnL.
    - Native export/label parity passes, all support requirements hold and no unresolved quote/metadata correctness defect remains.
  history_claim: D must advance and D-R pooled paired daily net difference must be positive in both validation months; otherwise no claim that 60s history improves the raw representation.
  representation_only_result: A stable IC/ranking improvement without quote net margin is evidence to investigate costs/target/execution, not a reason to train a larger learner.
  kill: With adequate support and correct data, neither CDF view passing means stop this frozen 5s basis-to-SSF economic formulation; retain all negatives and do not rescue it with DHF/DVF, 1/30s, new thresholds or sign reversal.
  insufficient: Inadequate support or semantic failure is inconclusive for economic information. Preserve the failure and repair only the demonstrated technical issue before a separately recorded rerun.
  observed_calendar_limit: The pre-outcome 90% pair-day floor admits the known two missing July recordings (20/22) and no planned August gap. All observed days stay included; evidence remains conditional on the observed calendar and missing days are never zero-imputed.
  next_if_pass: Predeclare a native one-contract execution confirmation and raw-versus-history/context attribution before any learner; this study alone cannot promote a production feature, sampler or policy.
retained_artifacts:
  - Complete source/environment/config/protocol/mapping manifests and date exposure records, including absent sources.
  - Native grid Parquet, two key-only flip traces, semantic manifests, v2 sample summaries and pilot repeat/parity results.
  - Frozen June centers/cutoffs, full intention table including inactive/unknown flags, exact joined quotes and cost components.
  - All pair/month/day/view/horizon/delay results, matched controls, context cells, confidence draws, failures and rejected claims.
