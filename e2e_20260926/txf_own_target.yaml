schema_version: 1
status: registered_before_raw_decoding
hypothesis_family: E2E_TXF_OWN_TARGET_20260927
purpose: Distinguish whether two specified native short-horizon TXF signals have directional information that survives TXF quote-crossing costs, versus
  information too weak for that cost structure. This is a no-fit quote-markout probe, not a fill backtest.
comparison:
  information_hypothesis: Signed own-book/own-trade imbalance predicts own TXF moves.
  cost_hypothesis: Gross directional information exists but spread and fees consume it.
  failure_scope: Only these two scores, fixed signs, thresholds, horizons and session.
  does_not_rule_out: Conditional information, richer native representations or learners.
  no_promotion: Passing permits a separately frozen native execution study only.
