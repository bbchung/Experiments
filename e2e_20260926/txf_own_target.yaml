  resolved_events_each_validation_month_min: 100
  observed_event_net_each_validation_month: positive
  observed_equal_day_net_each_validation_month: positive
  pooled_fee_stress_net: positive
  directional_increment_each_validation_month: positive
  pooled_actual_minus_best_matched_constant_side: positive
  pooled_event_and_equal_day_net_97_5_lower_bound: positive
  leave_best_profit_day_out_pooled_net: positive
  maximum_day_positive_net_profit_share: 0.3
  delay250ms_common_known_pooled_net_and_fee_stress: positive
  delay250ms_common_known_each_month_net: positive
  meaning: Research triage only; unknown outcomes and quote proxy preclude adoption.
futility:
  support_or_integrity_failure: Inconclusive; no changed date/age/contract rule to obtain a pass.
  gross_direction_fails: No support for these fixed native representations; no threshold or sign sweep.
  gross_pass_net_fails: Friction defeats this fixed formulation; no HPO rescue justified by this probe.
  primary_fails_sensitivity_wins: Report exploratory contrast; no advance under this registration.
  both_primary_fail: Close this two-score family and return to bottleneck evidence; no TXF-wide claim.
