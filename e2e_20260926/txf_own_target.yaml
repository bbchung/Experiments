  version: 4
  previous_failed_technical_freeze_sha256: ba7a49d916035274026f2a29dfeb3c1dd015680553a2389af60f5757bf01730a
  reason: Retain planned origins after recording EOF as unknown while requiring exact native capture prefix through the final published event clock.
    Preserve captured values and keys without feature reconstruction, forward fill or invented native rows. Correct unsupported-bootstrap status and
    complete equal-day report strata. Rerun the same three semantic dates in a fresh output; preserve every prior output. Signals, costs, dates,
    calibration, action schedule, endpoints, controls, bootstrap and advancement rules are unchanged.
  prior_structural_dates: [20260601, 20260603, 20260604, 20260605, 20260608, 20260609, 20260701, 20260803]
  prior_economic_analysis: none
  missing_capture: Native SampleTime must equal the exact planned-grid prefix at or before the last published event timestamp; interior holes,
    shifted rows and extra rows remain errors. The full planned grid is preserved separately; absent captures have null keys, NaN scores/labels,
    native_captured false and native_capture_unavailable status, even if the last quote would still satisfy the age limit.
  empty_capture: Missing Parquet is accepted only for a completed native run with schema2 zero sampled/emitted/pending/unresolved counters and
    an empty published-clock prefix. No file or feature row is synthesized.
  report_completion: For each planned arm/day/session/delivery cell, report both directions and delays. Resolved accepted intents define the
    conditional daily mean. No accepted intent with fully available cell origins contributes zero; all-unknown intents or unavailable origins
    without accepted intents remain unknown. A date assigned another delivery is a non-member, never zero. Preserve known/unknown/zero day
    counts and event/equal-day means for month, side, session and delivery; these diagnostic strata introduce no gates.
