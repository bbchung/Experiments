  product: TXF
  exchange_product_code: TX
  discovery:
  - 20260601
  - 20260630
  research_validation:
  - - 20260701
    - 20260731
  - - 20260801
    - 20260826
  protected_from: 20260828
  final_oos: false
  master_dates_source: txf-metadata-only-availability.json
  planned_days:
    202606: 21
    202607: 22
    202608: 18
  raw_missing_days_known_before_study:
  - 20260602
  - 20260729
  missing_day_policy: Retain every planned origin as recording_unavailable; never zero PnL.
  raw_format: Frozen original CSV only; private symlink root prevents BIN precedence.
  contract_metadata: /mnt/data0/contract/taifex/futures
  calendar: /mnt/data0/info/tw_trading_calendar.yaml
  calendar_sha256: 8b1b6c57bbc79137516aca57a61ede352523e41ba800010bb6b6b011f2bdcf78
contract:
  selector: Native TXF@1 ordered listed monthly contracts, no volume comparison.
  early_roll_convention: Skip current delivery month on third Wednesday and preceding trading day.
  expected_early_roll_dates:
  - 20260616
  - 20260714
  - 20260818
  prelaunch_validation: Freeze all 61 native resolved daily mappings and daily CSV hashes. Decode delivery month and reject stale/expired or absent metadata
    contracts, wrong exchange/state, wrong multiplier/tick, or unavailable selected raw file. Missing raw remains unknown; never substitute another contract.
    Early roll is a native convention, not an official rule.
  point_value_twd: 200
  tick_size_points: 1
  quantity_contracts: 1
  exclude:
  - continuous_R1_R2
  - weekly_contracts
  - night_session
native:
  proposed_binary: coco-correctness-v2
  proposed_binary_sha256: ee3c83f023b124852469715e93ecf2b1d06d215b4cd5758e1d7a31194b240fc5
  dependencies: Freeze binary, shared libraries, source manifest and exact declarations before replay.
  feature_generation: Native C++ only; no Python reconstruction of predictive features.
  sampler: DatasetWriter PeriodicSampler, 1s, all scheduled rows including nonfinite scores.
  origin_schema: schema2 sample summary; SampleTime, SampleBookTime, SampleBookSeq.
  feature_1:
    module: BookStructure.0
    feature: imbalance_touch.0
    parameters: {}
  feature_2:
    module: TradeFlowState.0
    feature: flow_quantity_imbalance0.0
    parameters:
      Window:
        Time:
        - 5s
      MinKnownSideShare: 0.8
  diagnostic_labels:
    type: ForwardReturnLabeler
    y: CurrentBook.0.book_mid_ticks.0
    horizons:
    - 10s
    - 60s
    role: Separate native endpoint diagnostics and pilot oracle. Missing labels cannot select origins, calibrate score thresholds, or choose accepted actions.
  tape: MdWriter has no StatusFilter and observes every delivered selected-contract book/trade. It is a normalized publication tape, not asserted raw input.
    Before analysis compare raw CSV book count, sequence/time normalization, all status classes and invalid books to this tape on structural pilot dates.
    Invalid trades rejected by TaifexFilter must be counted separately. If status transitions are omitted, reconstruct quote/status state from frozen raw
    CSV using the proven loader semantics; otherwise fail closed.
  parser_guards: No invalid_row_handler=skip. Reject malformed fields/status, unknown type, symbol mismatch or timestamp disorder unless exactly accounted
    for by frozen native loader max(previous_time, raw_time). Native source errors remain failures, never absent data. Validate all five levels, depth0..5,
    native Qty int32/Side uint8/int64 coordinates. Reject unsafe active-level nonfinite/out-of-int32 tick conversions and active same-side Tick ranges
    wider than INT32_MAX before native execution, because BookStructure subtracts Tick values before casting to double. Retain safe inactive nonfinite,
    zero, one-sided, crossed and status-invalid books. No row drops or new economic population rules.
  feature_status_filter: '!(TRIAL || AUCTION || SUSPEND) for CurrentBook, BookStructure and TradeFlowState; DatasetWriter/MdWriter have no status filter.'
  side_lineage:
    classifier: Stored Side must exactly match deterministic quote rule using preceding book in original file order; no later same-time record or ExchangeTime
      sorting. Both statuses continuous; SELL if last bid depth>0 and trade price<=bid (1e-8 tolerance), else BUY if ask depth>0 and price>=ask, else UNKNOWN.
      Do not require positive spread/depth quantity beyond this parser rule.
    all_panel_gate: All published positive-size/price trades, including UNKNOWN, must agree on all59available days before flow economic interpretation.
      No rewrite or row drop. Any disagreement makes flow arm inconclusive; touch independent.
    limit: This proves an observable causal equivalent only on retained recordings; original parser vintage and private packet-stale state are unrecovered.
      Disagreement is not by itself leakage.
  filtered_trade_status: Raw invalid-price/quantity trade rows remain inventoried with reject reasons. They do not enter native publication/feature/label
    oracles but their observed status is retained by the stronger conservative economic invalid-path rule.
  exports: Exact two named native features; RequireAlphaFactorExports disabled because TradeFlowState is a native bounded feature not annotated AlphaFactor.
    This tests predeclared primitives, not a canonical broad qualification relaxation. No feature values reconstructed in Python.
session:
  timezone: Asia/Taipei
  official_regular_hours:
  - 084500
  - 134500
  decision_start: 085000
  decision_until_inclusive: '134000'
  warmup: Five minutes after regular open; all native state initializes from the frozen day input.
  master_grid_rows_per_planned_day: 17401
  master_grid_rows_all_days: 1061461
  strata:
  - '[08:50,09:10)'
  - '[09:10,11:00)'
  - '[11:00,13:40]'
  insufficient_open_or_end_recording: Preserve unknown coverage; do not move the session.
  time_proof: Verify native TimeApi local date epoch and exact emitted grid on pilot.
arms:
  primary:
  - touch_imbalance_10s
  - trade_flow_5s_10s
  sensitivity:
  - touch_imbalance_60s
  - trade_flow_5s_60s
  sign: Continuation only; positive buys and negative sells, zero is neutral.
  rationale: Touch imbalance and five-second signed trade pressure may decay faster than the previous 30-1800s MXF-target studies. Ten seconds tests that
    short information scale; sixty seconds links to known longer-horizon failures without selecting a winner.
calibration:
  threshold: June absolute-score q95 using numpy linear quantile, inclusive ties.
  population: Every June scheduled origin with finite native score and causally known valid/fresh book; no native label or future quote availability filter.
    Report score-missing, invalid-book, stale-book, known-neutral and qualifying counts separately.
  frozen_before_validation: Both numeric thresholds and score population/hash receipt frozen before validation economic/association summaries; structural
    pilot native-label oracle is an explicitly permitted correctness check only.
  degenerate_score: If threshold nonpositive or finite support absent, arm unavailable; no replacement.
  no_tuning: No alternate quantile, sign, window, session, product or contract rule.
schedule:
  public_clock: Native logical receive time; never shift feature timestamps backward.
  origin: At each exact grid timestamp use emitted native sample and strictly earlier public book state.
  origin_age_max_ms: 1000
  cadence: Chronologically accept the first qualifying available signal, then reserve through t+h and allow the next at t+h+1s or later. One shared side-independent
    clock per arm. Schedule before consulting endpoints; unresolved accepted events still reserve time.
  neutral: A causally known nontrigger contributes no exposure, not an imputed unknown return.
  unavailable_policy: Record unavailable origin; do not invent a side, reservation or zero PnL.
quote_markout:
  primary_receive_delay_ms: 50
  robustness_receive_delay_ms: 250
  latency_interpretation: Declared conservative quote-markout delays on receive time, not measured exchange latency and not native private-exchange matching.
    No additional MdLatency shift.
  entry_boundary: t+delay
  exit_boundary: t+h+delay
  matching: Last publication strictly before each boundary; earlier timestamp ties use file order.
  exact_boundary_publication: Mark endpoint_tie_unknown, not an optimistic prior-book outcome.
  max_quote_age_ms: 1000
  validity: Retain latest invalid/auction/trial/halt/suspend state. Require positive finite bid/ask, ask greater than bid, each touch depth at least one
    contract, and a fresh valid book after any invalidation. Never skip invalids to bridge to an older valid book.
  delay_comparison: Identical frozen intents at 50/250ms; report each support and common-known paired subset. Do not use the intersection to improve the
    primary50ms reported population.
  quantity_limit: Only displayed one-contract top-of-book capacity; no queue or fill claim.
  path_invalidation: An invalid book or noncontinuous status (trial/auction/suspend, including TRADE) at any timestamp in [SampleTime, exit_boundary] makes
    the accepted intent unresolved even after reseeding. This covers decision-to-entry latency and never changes calibration/actions.
  coverage: Require a strictly later eligible continuous BOOK with two valid touches after exit_boundary. A late trade or EOF last-valid held quote cannot
    certify coverage.
costs:
  broker_commission_twd_per_leg: 50
  broker_commission_status: Conservative study assumption; actual brokerage negotiated.
  tax_rate_notional_per_leg: 2.0e-05
  tax: 0.00002 * 200 * actual_entry_or_exit_price, each leg separately.
  long_gross_points: exit_bid - entry_ask
  short_gross_points: entry_bid - exit_ask
  gross_cash: 200 * gross_points
  net_cash: gross_cash - commission_both_legs - tax_both_legs
  fee_stress: gross_cash - 1.2 * (commission_both_legs + tax_both_legs)
  spread: Already charged through bid/ask; decompose against same-clock mid markout without double count.
  rounding: No invented broker rounding; retain full precision and state this proxy limitation.
controls:
  matched:
  - always_long
  - always_short
  - expected_50_50_side
  schedule: Same intents, horizon, quotes, quantity and fee semantics as actual signal.
  directional_increment: Actual minus expected50_50; compare best constant side too.
  caveat: Positive net from market drift alone is not evidence of directional signal skill.
report:
  retain: All master origins, triggers, accepted intents, cadence rejections and unresolved reasons.
  populations: Separate score availability/all planned grid; endpoint support/all accepted intents.
  aggregations: Both equal-event means and equal-day means, by month, side, session and delivery contract.
  daily_zero: A fully observed known-no-trigger day is zero strategy exposure. Any unavailable origins make unconditional daily strategy PnL unknown; observed
    sum is explicitly conditional. Missing whole days stay in coverage tables and never enter as zero returns.
  missingness: Counts by month/day/status; observed conditional means plus missing-tail tipping values.
  diagnostics: Native-label association, midpoint gross, spread cost, commission, tax, net and fee stress.
  uncertainty: 10000 deterministic three-consecutive-planned-day moving-block resamples within each validation month, seed20260927; unknown days preserved.
    Report one-sided97.5% lower bounds for the two10s primary arms (family alpha5%), plus95% descriptive bounds. Bootstrap observed-day and event estimands
    separately; neither proves unknown outcomes.
  sensitivity: All60s and250ms cells shown; no sensitivity winner selection.
  observed_equal_day_net: Per day, mean net cash across resolved accepted intents. A fully score-observed day with no accepted intents contributes zero;
    a day with accepted but no resolved intents, or unavailable origins and no accepted intents, is unknown (NaN). Partial-day resolved means stay explicitly
    conditional. Monthly/pooled equal-day means weight these observed day means equally.
  observed_event_net: Sum known accepted-event net cash / number of resolved accepted events; unknown returns never zero. Cash totals are conditional observed
    sums, not complete strategy equity.
  bootstrap_algorithm: Within each validation month separately, draw ceil(N/3) blocks uniformly from all starts0..N-3 of three consecutive PLANNED dates,
    concatenate and truncate to N dates. Keep missing-day rows. Combine July/Aug draws with their original planned counts; pooled event statistic sums known
    cash and divides known counts, pooled equal-day statistic averages known day means. NaN days ignored in denominator only, never converted to zero.10000draws,seed20260927;
    empirical lower2.5thpercentile linear quantile. Fewer than20known validation days or>1%undefined replicates is inconclusive.
