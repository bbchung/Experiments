# Static plumbing example for 20260603 CDF/2330. NOT launched or runtime-validated.
# Render/freeze the explicit dated monthly contract, paths and output directory
# after native metadata preflight. Use corrected-v2 binary only after root review.
Modules:
  - Gid: ''
    Decl:
      - Desc: TseInfo.0
        Spec:
          twt84u: /mnt/data0/info/tse/stock/twt84u
          twtb4u: /mnt/data0/info/tse/stock/twtb4u
          disposition: /mnt/data0/info/tse/stock/disposition
          HistoryDays: 0
      - Desc: TaifexInfo.0
        Spec:
          Product: CDF
          TickLadder: stock_future
          PointValue: 2000
          BasicInfo: /mnt/data0/contract/taifex/futures
      - Desc: TradeBookMd.0
        Spec:
          Dirs:
            - /mnt/data0/marketdata/tse/kgi/stock
            - /mnt/data0/marketdata/taifex/kgi/futures
      - Desc: MarketInfoWriter.0
        Spec:
          OutputPath: ${cwd}/native-contracts.yaml
          Contracts: ['CDF@1', CDFF6, '2330']
  - Gid: pair
    Decl:
      - Desc: TaifexFilter.0
        Spec:
          Subscribe: [{Book: [CDFF6], Trade: [CDFF6]}]
      - Desc: TwseFilter.0
        Spec:
          RequireTradable: false
          Subscribe: [{Book: ['2330'], Trade: ['2330']}]
      - Desc: CurrentBook.0
        Spec:
          Dep: {Book: [TaifexFilter.0@pair], Trade: [TaifexFilter.0@pair]}
      - Desc: CurrentBook.1
        Spec:
          Dep: {Book: [TwseFilter.0@pair], Trade: [TwseFilter.0@pair]}
      - Desc: CrossMarketBasis.1
        Spec:
          TargetSymbol: CDFF6
          ReferenceSymbol: '2330'
          BaselineWindow: 60s
          MaxAge: 3s
          Dep: {Book: [TaifexFilter.0@pair, TwseFilter.0@pair]}
      - Desc: DatasetWriter.0
        Spec:
          Subscribe: [{Book: [CDFF6]}]
          Exports:
            - CrossMarketBasis.1.basis_bps.0@pair
            - CrossMarketBasis.1.basis_deviation_bps.0@pair
            - CrossMarketBasis.1.target_age_s.0@pair
            - CrossMarketBasis.1.reference_age_s.0@pair
            - CrossMarketBasis.1.target_latency_s.0@pair
            - CrossMarketBasis.1.reference_latency_s.0@pair
            - CrossMarketBasis.1.reference_spread_bps.0@pair
            - CrossMarketBasis.1.basis_history_fraction.0@pair
          MetadataExports:
            - {Feature: CurrentBook.0.book_mid_price.0@pair, Name: OriginMidPrice}
            - {Feature: CurrentBook.1.book_mid_price.0@pair, Name: ReferenceMidPrice}
            - {Feature: CurrentBook.0.book_bid_ticks.0@pair, Name: TargetBidTicks}
            - {Feature: CurrentBook.0.book_ask_ticks.0@pair, Name: TargetAskTicks}
          Labelers:
            - Type: ForwardReturnRateLabeler
              Spec:
                Dep: {Book: [CurrentBook.0@pair]}
                Labels:
                  - {Y: CurrentBook.0.book_mid_price.0@pair, Horizon: 1s, Scale: 10000, Name: ssf_mid_return_bps}
                  - {Y: CurrentBook.0.book_mid_price.0@pair, Horizon: 5s, Scale: 10000, Name: ssf_mid_return_bps}
                  - {Y: CurrentBook.0.book_mid_price.0@pair, Horizon: 30s, Scale: 10000, Name: ssf_mid_return_bps}
          PeriodicSampler: {StartTime: '091000', UntilTime: '130000', SampleInterval: 250ms}
          OutputPath: ${cwd}/grid/values.parquet
          Format: parquet
          UseTmp: true
          EmitSampleContext: true
          RequireAlphaFactorExports: true
      - Desc: DatasetWriter.1
        Spec:
          Subscribe: [{Book: [CDFF6]}]
          BookFlipSampler: {Mode: price_flip, MinInterval: 0s, StartTime: '091000', UntilTime: '130000'}
          OutputPath: ${cwd}/target-flips/keys.parquet
          Format: parquet
          UseTmp: true
          EmitSampleContext: true
      - Desc: DatasetWriter.2
        Spec:
          Subscribe: [{Book: ['2330']}]
          BookFlipSampler: {Mode: price_flip, MinInterval: 0s, StartTime: '091000', UntilTime: '130000'}
          OutputPath: ${cwd}/reference-flips/keys.parquet
          Format: parquet
          UseTmp: true
          EmitSampleContext: true
